<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Две пятёрки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: arena broadcast — quick, confident, a bit of scoreboard swagger
   IDEA: the coach's magnetic lineup board, drawn as a rink
   PICTURE: vertical rink with two fives and a goalie that fill up card by card
   COLOUR and TYPE: ice white, goal-line red, blue-line blue; Russo One for numbers, Rubik for text
   LAYOUT: board left, draft/tournament panel right; on phones the active panel comes first */
:root{color-scheme:light dark;--bg:light-dark(#e6eef5,#07101c);--pan:light-dark(#fff,#0f1b2c);--ink:light-dark(#0c1a2b,#e7eef6);--mut:light-dark(#566679,#97a8bc);--ice:light-dark(#f8fbfe,#0f2036);--board:light-dark(#bccbdb,#2a3e5a);--card:light-dark(#fff,#18304f);--dash:light-dark(#a2b5c8,#3c5677);--red:light-dark(#cf1f2e,#ff5262);--blue:light-dark(#1f4fd1,#6d97ff);--soft:light-dark(#edf2f7,#16263b);--ok:light-dark(#0f7a38,#55d486)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip}
body.lock{overflow:hidden}
h1,h2,h3{margin:0;font-weight:400}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{max-width:1180px;margin:0 auto;padding:22px max(4vw,12px) 14px;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:6px 20px}
.top h1{font:clamp(32px,6vw,46px)/1.05 'Russo One',sans-serif;letter-spacing:.01em}
.top h1 i{font-style:normal;color:var(--red)}
.sub{margin:4px 0 0;color:var(--mut)}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,12px) 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}.boardcol{position:sticky;top:12px}}
@media(max-width:899px){body.ph-draft .panel,body.ph-tour .panel{order:-1}}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.st{background:var(--pan);border-radius:12px;padding:6px 2px;text-align:center}
.st b{display:block;font:22px/1.15 'Russo One',sans-serif}
.st span{font-size:13px;color:var(--mut)}
.rink{position:relative;border:4px solid var(--board);border-radius:46px;background:var(--ice);padding:16px 12px 0;overflow:hidden}
.ln{position:relative;z-index:1}
.lt{font-size:13px;font-weight:500;color:var(--mut);margin:0 0 6px 4px}
.r3,.r2,.r1{display:grid;gap:8px}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r2{grid-template-columns:repeat(2,minmax(0,1fr));width:68%;margin:8px auto 0}
.r1{grid-template-columns:minmax(0,1fr);width:34%;margin:0 auto}
.redl{position:relative;height:4px;background:var(--red);margin:16px -12px}
.redl i{position:absolute;left:50%;top:50%;width:58px;height:58px;border:2px solid color-mix(in srgb,var(--blue) 45%,transparent);border-radius:50%;transform:translate(-50%,-50%)}
.redl i::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--blue)}
.bluel{height:6px;background:var(--blue);opacity:.85;margin:16px -12px 12px}
.gz{position:relative;padding:0 0 30px}
.gz::before{content:"";position:absolute;left:50%;bottom:12px;width:132px;height:46px;transform:translateX(-50%);border-radius:66px 66px 0 0;background:color-mix(in srgb,var(--blue) 20%,transparent)}
.gz::after{content:"";position:absolute;left:-12px;right:-12px;bottom:11px;height:2px;background:var(--red)}
.slot{position:relative;z-index:1;width:100%;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;border-radius:14px;border:2px solid transparent;background:var(--card);box-shadow:0 2px 0 var(--board);cursor:pointer;text-align:center}
.slot.empty{background:color-mix(in srgb,var(--ice) 60%,transparent);border:2px dashed var(--dash);box-shadow:none;cursor:default}
.lab{font:16px 'Russo One',sans-serif;color:var(--mut)}
.slot .rt{font:23px/1 'Russo One',sans-serif}
.sn{font-size:13px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut);white-space:nowrap}
.t90{border-color:var(--red)}.t90 .rt{color:var(--red)}
.t85 .rt{color:var(--blue)}
.off .mt{color:#c46a00}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.slot.cue{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 32%,transparent);cursor:pointer;animation:cuep 1.1s ease-in-out infinite}
@keyframes cuep{0%,100%{opacity:1}50%{opacity:.55}}
.selnote{margin:0 0 10px;font-size:14px;color:var(--mut)}
.selnote b{color:var(--ink);font-weight:500}
@media(max-width:520px){.slot{min-height:66px}.slot .rt{font-size:20px}.rink{border-radius:34px;padding:12px 8px 0}.redl,.bluel{margin-inline:-8px}.gz::after{left:-8px;right:-8px}}
.fl{width:22px;height:15px;flex:none;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.14);vertical-align:-2px}
.panel{background:var(--pan);border-radius:20px;padding:clamp(16px,3vw,24px)}
.ph{font:28px/1.1 'Russo One',sans-serif;margin-bottom:8px}
.lead{margin:0 0 16px;max-width:62ch}
.why{font-size:14px;color:var(--mut);margin:6px 0 0}
.btn{min-height:46px;padding:10px 18px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:500;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.big{width:100%;font-size:18px;min-height:54px;margin-top:14px}
.btn:disabled{opacity:.4;cursor:default}
.modes{display:grid;gap:8px}
.mode{display:grid;gap:2px;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--soft);border-radius:14px;background:var(--pan);cursor:pointer}
.mode b{font-weight:500;font-size:17px}.mode span{font-size:14px;color:var(--mut)}
.mode[aria-pressed=true]{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--pan))}
.codebox{margin-top:18px}
.codebox label{font-size:14px;color:var(--mut)}
.row{display:flex;gap:8px;margin-top:4px}
.row input{flex:1;min-height:46px;padding:8px 12px;border:2px solid var(--soft);border-radius:12px;background:var(--pan);color:var(--ink);font:16px Rubik,sans-serif;text-transform:uppercase}
.rules{margin:18px 0 0;padding-left:20px;color:var(--mut);font-size:15px}
.rules li{margin:4px 0}
.drhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:15px;margin-bottom:10px}
.drhead b{color:var(--ink);font:18px 'Russo One',sans-serif}
.draw{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:14px;border-radius:16px;background:var(--soft)}
.draw .fl{width:66px;height:44px;border-radius:6px}
.draw>div{flex:1 1 150px}
.draw .btn{background:var(--pan)}
@media(max-width:520px){.draw .btn{flex:1 1 100%}}
.draw h2{font:30px/1.05 'Russo One',sans-serif}
.draw p{margin:4px 0 0;color:var(--mut)}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:1px 8px;border-radius:99px;background:var(--pan);color:var(--ink);vertical-align:1px}
.m1{background:#e9c34f;color:#3a2a00}.m2{background:#cdd4dc;color:#1c232b}.m3{background:#d6935f;color:#2b1300}
.sec h3{font-size:14px;font-weight:500;color:var(--mut);margin:16px 0 4px}
.pl{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:48px;padding:5px 8px;border:0;border-radius:12px;background:transparent;text-align:left;cursor:pointer}
.pl:hover:not(:disabled){background:var(--soft)}
.pl:disabled{opacity:.38;cursor:default}
.chip{font:18px/1 'Russo One',sans-serif;text-align:center;padding:7px 0;border-radius:9px;background:var(--soft)}
.pl.t90 .chip{background:var(--red);color:#fff}.pl.t85 .chip{background:var(--blue);color:#fff}.pl.t80 .chip{background:var(--ink);color:var(--pan)}
.pl.t90{border-color:transparent}
.pl.sel{box-shadow:inset 0 0 0 2px var(--red);border-radius:12px}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{font-size:13px;color:var(--mut)}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:520px){.styles{grid-template-columns:minmax(0,1fr)}}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,10,20,.5)}
.sheet[hidden]{display:none}
.sh{width:min(560px,100%);max-height:82vh;overflow:auto;background:var(--pan);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.sh h3{font:22px/1.15 'Russo One',sans-serif;margin-bottom:4px}
.opts{display:grid;gap:6px;margin:12px 0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:50px;padding:8px 14px;border:0;border-radius:12px;background:var(--soft);text-align:left;cursor:pointer}
.opt small{display:block;font-size:13px;color:#c46a00}
.opt b{font:20px 'Russo One',sans-serif}
.sh textarea{width:100%;min-height:150px;font:15px Rubik,sans-serif;padding:10px;border-radius:12px;border:2px solid var(--soft);background:var(--pan);color:var(--ink)}
.res{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.disc{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font:34px 'Russo One',sans-serif;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.18)}
.disc.m1{background:radial-gradient(circle at 35% 30%,#fff3c4,#d9a91c 58%,#8d6500)}
.disc.m2{background:radial-gradient(circle at 35% 30%,#fff,#b7c0ca 58%,#6c7784)}
.disc.m3{background:radial-gradient(circle at 35% 30%,#ffe0c6,#c47a3f 58%,#7a4114)}
.disc.m4{background:var(--soft);color:var(--mut);box-shadow:none}
.res h2{font:clamp(28px,5vw,40px)/1.05 'Russo One',sans-serif}
.res p{margin:4px 0 0;color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.game{border-radius:14px;background:var(--soft);margin:8px 0}
.game summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
.game summary::-webkit-details-marker{display:none}
.gl{display:grid;font-size:13px;color:var(--mut)}
.gl b{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500;color:var(--ink);overflow:hidden;white-space:nowrap}
.score{font:24px 'Russo One',sans-serif;white-space:nowrap}
.score small{font:13px Rubik,sans-serif;color:var(--mut)}
.W .score{color:var(--ok)}.L .score{color:var(--red)}
.evs{list-style:none;margin:0;padding:0 14px 12px;font-size:15px}
.evs li{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:6px;align-items:baseline;padding:4px 0;border-top:1px solid var(--pan)}
.evs li span:first-child{font-variant-numeric:tabular-nums;color:var(--mut)}
.evs li .fl{margin-right:6px}
.evs .op{color:var(--mut)}
.evs .pn{font-size:14px;color:var(--mut)}
.evs .ph{display:block;padding:10px 0 2px;border-top:0;font-size:13px;font-weight:500;color:var(--mut)}
.evs em{font-style:normal;font-size:13px;color:var(--blue)}
.evs .sa{font:15px 'Russo One',sans-serif;color:var(--ink)}
.live{background:var(--soft);border-radius:16px;padding:14px;margin:4px 0 10px}
.live .ks{margin-top:0}
.onair{color:var(--red);font-weight:500}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.tm{display:flex;align-items:center;gap:8px;font-weight:500;line-height:1.2}.tm.r{justify-content:flex-end;text-align:right}
.big{font:clamp(34px,8vw,46px)/1 'Russo One',sans-serif;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:12px;background:var(--ink);color:var(--pan)}
.clk{text-align:center;margin-top:10px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--pan);border-radius:4px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--red)}
.pp{font-size:14px;color:var(--mut);text-align:center;min-height:21px}.pp b{color:var(--red);font-weight:500}
.feed{max-height:290px;overflow:auto;margin:8px 0 4px;padding:0 10px 8px;background:var(--pan);border-radius:12px}
.feed li{border-top-color:var(--soft)}
h3.tt{font:20px 'Russo One',sans-serif;margin:22px 0 6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:500;color:var(--mut);font-size:13px}
td,th{padding:6px 5px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
td:nth-child(2),th:nth-child(2){text-align:left;white-space:normal}
tr.me td{background:color-mix(in srgb,var(--red) 11%,transparent);font-weight:500}
tr.cut td{border-bottom:2px solid var(--red)}
.ko{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--soft);font-size:15px}
.ko span{display:flex;align-items:center;gap:6px}.ko span:last-child{justify-content:flex-end;text-align:right}
.ko b{font:17px 'Russo One',sans-serif;white-space:nowrap}
.ko .win{font-weight:500}
.ks{font-size:14px;color:var(--mut);margin:14px 0 2px}
.sc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:15px;margin-top:6px}
.sc span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.badge{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--red);color:#fff;font-size:14px;font-weight:500}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--pan);padding:10px 18px;border-radius:12px;font-size:15px}
.toast[hidden]{display:none}
.foot{max-width:1180px;margin:0 auto;padding:0 max(4vw,12px) 28px;font-size:13px;color:var(--mut)}
.foot a{color:inherit}
@media(prefers-reduced-motion:reduce){.pop,.slot.cue{animation:none}}
</style>
</head>
<body>

  <p class="sub" id="dbline"></p>
</header>
<main class="wrap">

</main>

<div id="toast" class="toast" hidden></div>

 for(let t=0;t<7;t++){const l=[0,...o];rr.push([0,1,2,3].map(i=>[l[i],l[7-i]]));o=[o[6],...o.slice(0,6)]}
 const sim=G=>rr.map(ps=>ps.map(([i,j])=>{let a=G[i],b=G[j];if(b.me)[a,b]=[b,a];return play(a,b,r,0,!!a.me)}));
 const RA=sim(GA),RB=sim(GB),tA=table(GA,RA,7).map(x=>x.t),tB=table(GB,RB,7).map(x=>x.t);
 const ko=([a,b],k)=>{if(b.me)[a,b]=[b,a];return play(a,b,r,k,!!a.me)},Wn=m=>m.ga>m.gb?m.a:m.b,Ls=m=>m.ga>m.gb?m.b:m.a;
 const qf=[[tA[0],tB[3]],[tB[1],tA[2]],[tB[0],tA[3]],[tA[1],tB[2]]].map(p=>ko(p,1)),sf=[[Wn(qf[0]),Wn(qf[1])],[Wn(qf[2]),Wn(qf[3])]].map(p=>ko(p,1)),br=ko([Ls(sf[0]),Ls(sf[1])],1),fin=ko([Wn(sf[0]),Wn(sf[1])],2);
 const G=RA.map((ms,t)=>({lab:'Группа A · тур '+(t+1),m:ms.find(m=>m.a.me),po:0,co:ms.filter(m=>!m.a.me)}));let place=9;const q=qf.find(m=>m.a.me);
 if(q){G.push({lab:'1/4 финала',m:q,po:1,co:qf.filter(m=>m!==q)});place=5;if(Wn(q)===me){const s=sf.find(m=>m.a.me);G.push({lab:'1/2 финала',m:s,po:2,co:sf.filter(m=>m!==s)});if(Wn(s)===me){G.push({lab:'Финал',m:fin,po:3,co:[]});place=Wn(fin)===me?1:2}else{G.push({lab:'Матч за бронзу',m:br,po:3,co:[]});place=Wn(br)===me?3:4}}}
 return{me,GA,GB,RA,RB,qf,sf,fin,br,G,place,gpos:tA.indexOf(me)+1,Wn}}
function runTour(){stopLive();st.T=tourney(st.seed+'|T|'+st.runs);st.rev=0;st.phase='tour';
 const T=st.T,w=T.G.filter(g=>g.m.ga>g.m.gb).length,rec={place:T.place,w,n:T.G.length},b=LS.get('dp_best');
 if(!b||rec.place<b.place||(rec.place===b.place&&rec.w>b.w))LS.set('dp_best',rec);

function pReady(){const cp=chem(st.L),S=[['Оборона','меньше голов, крепче у своих ворот'],['Баланс','без перекосов'],['Атака','больше бросков и голов в обе стороны']];

function pTour(){const T=st.T,n=T.G.length,rv=Math.min(st.rev,n),done=rv>=n&&!LV,shown=T.G.slice(0,rv),stage=done?3:shown.length?shown[shown.length-1].po:0;

  ${st.daily&&st.runs>0?'<p class="why">Это повторный прогон — в зачёт ежедневного вызова идёт первый.</p>':''}

 else if(a==='start')start(ui.mode==='D'?'D'+today():ui.mode+newCode());
 else if(a==='code'){const v=$('#codeIn').value.trim().toUpperCase().replace(/\s/g,'');if(/^[CAD][A-Z0-9]{4,12}$/.test(v))start(v);else $('#codeErr').textContent='Код начинается с C, A или D, например C7KQ2X.'}
 else if(a==='reroll'){if(st.rr>0){st.rr--;st.k++;st.pick=null;draw();render()}}
 else if(a==='pick')selectPlayer(SQ[st.cur].pl[+b.dataset.p]);
 else if(a==='place')place(+b.dataset.k);
 else if(a==='cancelSel'){st.pick=null;render()}
 else if(a==='slot'){const k=+b.dataset.k;if(st&&(st.phase==='draft'||st.phase==='ready')&&st.L[k])openMove(k)}
 else if(a==='move')doMove(+b.dataset.k);
 else if(a==='close')closeSheet();
 else if(a==='style'){st.style=+b.dataset.s;render()}
 else if(a==='go')runTour();
 else if(a==='next')startLive();
 else if(a==='skip'){if(LV){updLive(1);endLive()}}
 else if(a==='all'){stopLive();st.rev=st.T.G.length;render()}
 else if(a==='again'){st.runs++;runTour()}
 else if(a==='new'){stopLive();st=null;ui.mode='C';render();scrollTo({top:0})}
 else if(a==='copy')copy()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();if(e.key==='Enter'&&e.target.id==='codeIn')document.querySelector('[data-act=code]').click()});
const np=new Set(SQ.flatMap(s=>s.pl.map(p=>p.n))).size,ys=SQ.map(s=>s.y);
$('#dbline').textContent=`${new Set(SQ.map(s=>s.c)).size} сборных · ${SQ.length} составов · ${np} игроков · ${Math.min(...ys)}–${Math.max(...ys)}`;
render();
}
</script>
</body>
</html>
